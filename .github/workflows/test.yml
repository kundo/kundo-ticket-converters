name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the oldest version the converters support. No packages are
        # installed, so the tests also fail if a converter needs one.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: |
          for converter in */; do
            python -m unittest discover -s "$converter"
          done
